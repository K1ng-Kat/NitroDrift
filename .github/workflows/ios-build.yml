name: iOS Build Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulator-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Validate NitroDrift sync tooling
        run: |
          bash -n scripts/nd-sync
          python3 -m py_compile scripts/merge_xcode_settings.py scripts/recover_xcode_project.py
          python3 - <<'PY'
          import pathlib, tempfile, subprocess
          with tempfile.TemporaryDirectory() as root:
              folder = pathlib.Path(root)
              base = folder / "base"
              local = folder / "local"
              remote = folder / "remote"
              merged = folder / "merged"
              base.write_text("VERSION = 1;\nDEVELOPMENT_TEAM = \"\";\n", encoding="utf-8")
              local.write_text("VERSION = 1;\nDEVELOPMENT_TEAM = \"USERTEAM\";\n", encoding="utf-8")
              remote.write_text("VERSION = 2;\nDEVELOPMENT_TEAM = \"\";\n", encoding="utf-8")
              subprocess.run(["python3", "scripts/merge_xcode_settings.py",
                  str(base), str(local), str(remote), str(merged)], check=True)
              assert merged.read_text() == "VERSION = 2;\nDEVELOPMENT_TEAM = \"USERTEAM\";\n"
              # A structural Xcode rewrite must not block preserving a
              # changed signing team, and must be flagged for backup retention.
              local.write_text("VERSION = 1;\nXCODE_EDIT = YES;\nDEVELOPMENT_TEAM = \"USERTEAM\";\n")
              marker = folder / "not_recovered.txt"
              subprocess.run(["python3", "scripts/merge_xcode_settings.py",
                  str(base), str(local), str(remote), str(merged), str(marker)], check=True)
              assert "DEVELOPMENT_TEAM = \"USERTEAM\";" in merged.read_text()
              assert "VERSION = 2;" in merged.read_text()
              assert marker.is_file(), "Other local changes must retain recovery backups"
          PY
      - name: Physics smoke tests
        run: |
          swiftc NitroDrift/CarDynamics.swift scripts/PhysicsSmokeTest.swift -o "$RUNNER_TEMP/physics-smoke"
          "$RUNNER_TEMP/physics-smoke"
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project NitroDrift.xcodeproj \
            -target NitroDrift \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Launch Ultra Rain in iPhone simulator
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]')
        shell: bash
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available --json | python3 -c '
          import json,sys
          devices=json.load(sys.stdin)["devices"]
          for items in devices.values():
              for d in items:
                  if d.get("isAvailable") and "iPhone" in d.get("name",""):
                      print(d["udid"])
                      sys.exit(0)
          ')"
          if [[ -z "$DEVICE" ]]; then
            echo "No installed iPhone runtime; compile is still checked."
            exit 0
          fi
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$PWD/build/Debug-iphonesimulator/NitroDrift.app"
          xcrun simctl launch "$DEVICE" com.kingkat.NitroDrift \
            -streetWeather rain -graphicsQuality ultra -screenRefractionEnabled YES -ndAutomatedDrive
          sleep 10
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/nitro-ultra-rain.png"
      - name: Save rendered screenshot
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]')
        uses: actions/upload-artifact@v4
        with:
          name: nitro-ultra-rain-screenshot
          path: ${{ runner.temp }}/nitro-ultra-rain.png
          if-no-files-found: ignore
          retention-days: 7
