name: iOS Build Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulator-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Physics smoke tests
        run: |
          swiftc NitroDrift/CarDynamics.swift scripts/PhysicsSmokeTest.swift -o "$RUNNER_TEMP/physics-smoke"
          "$RUNNER_TEMP/physics-smoke"
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project NitroDrift.xcodeproj \
            -target NitroDrift \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
