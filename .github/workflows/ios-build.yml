name: iOS Build Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulator-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Validate NitroDrift sync tooling
        run: |
          bash -n scripts/nd-sync
          python3 -m py_compile scripts/merge_xcode_settings.py scripts/recover_xcode_project.py
          python3 - <<'PY'
          import pathlib, tempfile, subprocess
          with tempfile.TemporaryDirectory() as root:
              folder = pathlib.Path(root)
              base = folder / "base"
              local = folder / "local"
              remote = folder / "remote"
              merged = folder / "merged"
              base.write_text("VERSION = 1;\nDEVELOPMENT_TEAM = \"\";\n", encoding="utf-8")
              local.write_text("VERSION = 1;\nDEVELOPMENT_TEAM = \"USERTEAM\";\n", encoding="utf-8")
              remote.write_text("VERSION = 2;\nDEVELOPMENT_TEAM = \"\";\n", encoding="utf-8")
              subprocess.run(["python3", "scripts/merge_xcode_settings.py",
                  str(base), str(local), str(remote), str(merged)], check=True)
              assert merged.read_text() == "VERSION = 2;\nDEVELOPMENT_TEAM = \"USERTEAM\";\n"
              # A structural Xcode rewrite must not block preserving a
              # changed signing team, and must be flagged for backup retention.
              local.write_text("VERSION = 1;\nXCODE_EDIT = YES;\nDEVELOPMENT_TEAM = \"USERTEAM\";\n")
              marker = folder / "not_recovered.txt"
              subprocess.run(["python3", "scripts/merge_xcode_settings.py",
                  str(base), str(local), str(remote), str(merged), str(marker)], check=True)
              assert "DEVELOPMENT_TEAM = \"USERTEAM\";" in merged.read_text()
              assert "VERSION = 2;" in merged.read_text()
              assert marker.is_file(), "Other local changes must retain recovery backups"
          PY
      - name: Physics smoke tests
        run: |
          swiftc NitroDrift/Gameplay/CarDynamics.swift scripts/PhysicsSmokeTest.swift -o "$RUNNER_TEMP/physics-smoke"
          "$RUNNER_TEMP/physics-smoke"
      - name: Restore baked road textures
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/NitroDriftArt
          key: nd-road-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bake_roads.py', 'scripts/prepare_road_pack.sh', 'NitroDrift/Assets.scnassets/Surfaces/asphalt_*.jpg') }}
      - name: Prepare full-resolution road artwork
        run: |
          set -euo pipefail
          pack="$(bash scripts/prepare_road_pack.sh)"
          echo "ND_ROAD_PACK=$pack" >> "$GITHUB_ENV"
      - name: Build full iPhone release
        run: |
          set -euo pipefail
          xcodebuild -project NitroDrift.xcodeproj -target NitroDrift -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO SYMROOT="$RUNNER_TEMP/nd-build" ND_ROAD_PACK="$ND_ROAD_PACK" build
          mkdir -p "$RUNNER_TEMP/nd-package/Payload"
          mv "$RUNNER_TEMP/nd-build/Release-iphoneos/NitroDrift.app" "$RUNNER_TEMP/nd-package/Payload/"
          cd "$RUNNER_TEMP/nd-package"
          /usr/bin/zip -q -r -n .ndroad:.usdz:.jpg:.png:.hdr "$RUNNER_TEMP/NitroDrift-unsigned.ipa" Payload
          python3 - <<'PY_SIZE'
          from pathlib import Path
          import os, json
          app = Path("Payload/NitroDrift.app")
          ipa = Path(os.environ["RUNNER_TEMP"]) / "NitroDrift-unsigned.ipa"
          size = {"appBytes": sum(p.stat().st_size for p in app.rglob("*") if p.is_file()),
                  "ipaBytes": ipa.stat().st_size, "roadSegments": len(list((app/"RoadPack").glob("*.ndroad")))}
          assert size["appBytes"] >= 1024**3 and size["ipaBytes"] >= 1024**3 and size["roadSegments"] == 84, size
          print(size)
          (ipa.parent/"build-size.json").write_text(json.dumps(size, indent=2))
          PY_SIZE
      - name: Save iPhone release
        uses: actions/upload-artifact@v4
        with:
          name: NitroDrift-iPhone-unsigned
          path: |
            ${{ runner.temp }}/NitroDrift-unsigned.ipa
            ${{ runner.temp }}/build-size.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Build and drive on the simulator
        run: |
          set -euo pipefail
          xcodebuild -project NitroDrift.xcodeproj -target NitroDrift -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO SYMROOT="$RUNNER_TEMP/nd-build" ND_ROAD_PACK="$ND_ROAD_PACK" build
          bash scripts/capture_simulator.sh "$RUNNER_TEMP/nd-build/Debug-iphonesimulator/NitroDrift.app" "$RUNNER_TEMP/race-captures"
      - name: Save gameplay captures and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-and-timing
          path: ${{ runner.temp }}/race-captures
          if-no-files-found: warn
          retention-days: 7
